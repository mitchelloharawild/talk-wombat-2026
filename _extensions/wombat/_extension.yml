title: WOMBAT Slides
author: WOMBAT 2026 committee
version: 0.2.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: [default, wombat.scss]
      css: wombat.css
      template-partials:
        - title-slide.html
      include-after-body:
        - countdown.html
      width: 1600
      height: 900
      margin: 0
      center: false
      slide-level: 2
      slide-number: c
      controls: false
      progress: false
      transition: fade
      transition-speed: fast
      background-transition: fade
      highlight-style: github
      code-line-numbers: false
      lang: en-AU
      date-format: "D MMMM YYYY"
      footer: "[WOMBAT [2026]{.yr}]{.wm} [wombat.numbat.space](https://wombat.numbat.space)"
