<script>
// Break slides: adds the WOMBAT 2026 lockup, a live countdown and the return time.
// until="13:00" counts to that time today on this computer's clock (24 hour);
// minutes=15 starts counting when the slide is first shown.
// Double-click the return time to change it: Enter or clicking away saves, Escape cancels.
// Changes to until breaks last for the day on this computer, and reach the speaker view.
(function () {
  const pad = n => String(n).padStart(2, "0");
  const hhmm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
  const valid = t => /^([01]?\d|2[0-3]):[0-5]\d$/.test(t || "");
  const day = () => { const d = new Date(); return [d.getFullYear(), pad(d.getMonth() + 1), pad(d.getDate())].join("-"); };
  const at = t => { const [h, m] = t.split(":").map(Number); return new Date().setHours(h, m, 0, 0); };
  const label = t => { const [h, m] = t.split(":").map(Number); return (h % 12 || 12) + ":" + pad(m) + (h < 12 ? " am" : " pm"); };
  function fmt(ms) {
    const t = Math.ceil(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = pad(t % 60);
    return h ? h + ":" + pad(m) + ":" + s : m + ":" + s;
  }
  const key = b => ["wombat-break", location.pathname, b.s.id, b.planned || "", day()].join("|");
  function load(b) {
    try { const t = localStorage.getItem(key(b)); return valid(t) ? t : null; } catch (e) { return null; }
  }
  function save(b) {
    try { localStorage.setItem(key(b), b.until); } catch (e) { /* storage blocked: the change lasts until reload */ }
  }

  const breaks = [...document.querySelectorAll(".reveal .slides section.break")].map(s => {
    const lockup = document.createElement("div");
    lockup.className = "break-lockup";
    lockup.innerHTML = '<i aria-hidden="true"></i><span class="wm">WOMBAT <span class="yr">2026</span></span>';
    s.prepend(lockup);
    const planned = valid(s.dataset.until) ? s.dataset.until : null;
    const b = { s, planned, until: planned, minutes: parseFloat(s.dataset.minutes), end: null, input: null };
    if (!planned && !(b.minutes > 0)) return null;
    if (planned) b.until = load(b) || planned;
    b.el = document.createElement("div");
    b.el.className = "countdown";
    b.el.setAttribute("role", "timer");
    b.back = document.createElement("p");
    b.back.className = "break-back";
    b.time = document.createElement("span");
    b.time.className = "break-time";
    b.time.title = "Double-click to change";
    b.back.append("Back at ", b.time);
    const h = s.querySelector("h2");
    h ? h.after(b.el, b.back) : s.append(b.el, b.back);
    b.time.addEventListener("dblclick", e => { e.preventDefault(); edit(b); });
    return b;
  }).filter(Boolean);

  function edit(b) {
    if (b.input) return;
    const input = b.input = document.createElement("input");
    input.type = "time";
    input.className = "break-input";
    input.setAttribute("aria-label", "Return time");
    input.value = b.until ? pad(b.until.split(":")[0]) + ":" + b.until.split(":")[1] : hhmm(new Date(b.end ?? Date.now() + b.minutes * 60000));
    const before = input.value;
    function close(keep) {
      if (b.input !== input) return;
      b.input = null;
      const t = input.value;
      if (keep && valid(t) && t !== before) { b.until = t; save(b); }
      input.remove();
      b.time.hidden = false;
      tick();
    }
    input.addEventListener("keydown", e => {
      e.stopPropagation(); // keep reveal's shortcuts away from typing
      if (e.key === "Enter") close(true);
      if (e.key === "Escape") { e.preventDefault(); close(false); }
    });
    input.addEventListener("blur", () => close(true));
    b.time.hidden = true;
    b.time.after(input);
    input.focus();
  }

  function tick() {
    for (const b of breaks) {
      if (!b.until && b.end === null && b.s.classList.contains("present")) b.end = Date.now() + b.minutes * 60000;
      const end = b.until ? at(b.until) : b.end;
      const left = end === null ? b.minutes * 60000 : end - Date.now();
      b.el.classList.toggle("done", left <= 0);
      const text = left > 0 ? fmt(left) : "Starting now";
      if (b.el.textContent !== text) b.el.textContent = text;
      b.back.hidden = end === null;
      if (end !== null) {
        const t = label(b.until || hhmm(new Date(end)));
        if (b.time.textContent !== t) b.time.textContent = t;
      }
    }
  }
  addEventListener("storage", e => {
    for (const b of breaks) if (e.key === key(b) && valid(e.newValue)) { b.until = e.newValue; tick(); }
  });
  if (breaks.length) { tick(); setInterval(tick, 250); }
})();
</script>
